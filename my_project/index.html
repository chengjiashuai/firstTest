<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel 文件上传和解析</title>
    <link rel="stylesheet" href="plugin/layui/css/layui.css">
    <script src="plugin/jQuery-min.js"></script>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        table, th, td {
            border: 1px solid black;
        }

        th, td {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
<button type="button" class="layui-btn" id="upload-btn">
    <i class="layui-icon">&#xe67c;</i>上传
</button>

<!--<button type="button" class="layui-btn" id="pdf-btn">-->
<!--    <i class="layui-icon">&#xe601;</i>转成pdf-->
<!--</button>-->

<input type="file" style="display: none" id="fileUpload" accept=".xlsx, .xls, .csv"/>
<br><br>

<!--解析数据展示-->
<table id="excelTable" lay-filter="test"></table>

<script src="plugin/layui/layui.js"></script>
<script src="plugin/xlsx.full.min.js"></script>
<script src="plugin/html2pdf.bundle.min.js"></script>
<script src="js/index.js"></script>
<script>
  // 监听文件上传事件
  $('#fileUpload').on('change', handleFile);

  // 点击文件上传
  $('#upload-btn').on('click', function (){
    $('#fileUpload').click();
  })

  // toPdf
  $("#pdf-btn").on('click', function (){
    toPdf()
  });
</script>

</body>
</html>
