<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <style>
        .step-container {
            display: flex;
            font-family: sans-serif;
            font-size: 14px;
        }

        .step {
            position: relative;
            padding: 10px 20px;
            color: white;
            background-color: #4CAF50; /* 已完成为绿色 */
            margin-left: -1px; /* 重叠形成贴合箭头 */
            z-index: 1;
            clip-path: polygon(
                    0% 0%,
                    94% 0%,
                    100% 50%,
                    94% 100%,
                    0% 100%,
                    6% 50%
            );
            border-right: 2px solid white; /* 白色分割线 */
            white-space: nowrap;
        }

        .step:first-child {
            margin-left: 0;
        }

        .step.current {
            background-color: #1e64b7; /* 当前步骤为蓝色 */
        }

        .step.upcoming {
            background-color: #e0e6f0; /* 未完成为灰色 */
            color: #666;
        }

        .step:last-child {
            clip-path: polygon(
                    0% 0%,
                    94% 0%,
                    100% 50%,
                    94% 100%,
                    0% 100%,
                    6% 50%
            );
            border-right: none;
        }
