name: Coordinated Deploy for Backend and Frontend

on:
  push:
    tags:
      - 'v*.*.*-rc.*'

jobs:
  build-and-release-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4
        with:
          repository: timberxai/PlanRightNow-front
          token: ${{ secrets.FRONT_PAT_TOKEN }}
          ref: master
          submodules: 'recursive'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          cache: 'pnpm'

      - name: Install Dependencies and Build
        run: |
          pnpm install
          pnpm run build:preprod

      - name: Archive build artifacts
        run: |
          tar -czvf frontend-dist.tar.gz -C dist .

      - name: Create Release and Upload Artifact
        uses: softprops/action-gh-release@v1
        with:
          files: frontend-dist.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Feishu
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ Succeeded"
            TEMPLATE="green"
          else
            STATUS="❌ Failed"
            TEMPLATE="red"
          fi

          # --- 获取标签或提交消息 ---
          # 优先尝试获取附注标签 (annotated tag) 的消息.
          # 如果是轻量标签 (lightweight tag), 则回退到使用 commit message.
          # 这个过程通过 GitHub API 实现, 无需额外 checkout.
          API_URL="https://api.github.com"
          REPO_FULL="${{ github.repository }}"
          TAG_NAME="${{ github.ref_name }}"
          AUTH_HEADER="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          ACCEPT_HEADER="Accept: application/vnd.github.v3+json"

          # 1. 获取 ref 信息, 判断是附注标签还是轻量标签
          REF_INFO=$(curl -s -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$API_URL/repos/$REPO_FULL/git/refs/tags/$TAG_NAME")
          OBJECT_TYPE=$(echo "$REF_INFO" | jq -r '.object.type')
          OBJECT_SHA=$(echo "$REF_INFO" | jq -r '.object.sha')

          # 2. 如果是附注标签 ('tag'), 则获取其消息; 否则, 使用 commit 消息
          if [ "$OBJECT_TYPE" == "tag" ]; then
            TAG_INFO=$(curl -s -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$API_URL/repos/$REPO_FULL/git/tags/$OBJECT_SHA")
            MESSAGE_BODY=$(echo "$TAG_INFO" | jq -r '.message')
            MESSAGE_TITLE="Tag Message"
          else
            MESSAGE_BODY='${{ github.event.head_commit.message }}'
            MESSAGE_TITLE="Commit Message"
          fi
          # --- 消息获取结束 ---

          ESCAPED_MESSAGE=$(echo "$MESSAGE_BODY" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          AUTHOR="${{ github.actor }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          curl -X POST "${{ secrets.CI_DONE_FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "msg_type": "interactive",
            "card": {
              "config": {
                "wide_screen_mode": true
              },
              "header": {
                "title": {
                  "tag": "plain_text",
                  "content": "🚀 Frontend Build & Release Notification"
                },
                "template": "$TEMPLATE"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**Repository**: ${{ github.repository }}\\n**Tag**: [$TAG_NAME]($REPO_URL/releases/tag/$TAG_NAME)\\n**Status**: $STATUS\\n**Triggered by**: $AUTHOR"
                  }
                },
                {
                  "tag": "hr"
                },
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**$MESSAGE_TITLE**: $ESCAPED_MESSAGE"
                  }
                },
                {
                  "tag": "action",
                  "actions": [
                    {
                      "tag": "button",
                      "text": {
                        "tag": "plain_text",
                        "content": "View Release"
                      },
                      "url": "$REPO_URL/releases/tag/$TAG_NAME",
                      "type": "primary"
                    },
                    {
                      "tag": "button",
                      "text": {
                        "tag": "plain_text",
                        "content": "View Workflow Run"
                      },
                      "url": "$REPO_URL/actions/runs/${{ github.run_id }}",
                      "type": "default"
                    }
                  ]
                }
              ]
            }
          }
          EOF
