name: Feishu Commit Test

on:
  push:
    branches:
      - dev

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify Feishu
        run: |
          COMMITS_LIST=$(git log --pretty="format:%h %s (%an)" -10)
          COMMITS_COUNT=$(echo "$COMMITS_LIST" | wc -l | tr -d ' ')
          ESCAPED_COMMITS=$(printf "%s\n" "$COMMITS_LIST" | sed 's/"/\\"/g')

          curl -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "msg_type": "interactive",
            "card": {
              "header": {
                "title": { "tag": "plain_text", "content": "🚀 Commit 测试" },
                "template": "green"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**最近提交（$COMMITS_COUNT 条）**\n```\n$ESCAPED_COMMITS\n```"
                  }
                }
              ]
            }
          }
          EOF
