name: Dev Build for Frontend

on:
  push:
    branches:
      - dev

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4
        with:
          repository: timberxai/PlanRightNow-front
          token: ${{ secrets.FRONT_PAT_TOKEN }}
          ref: dev
          submodules: 'recursive'
          fetch-depth: 0  # 保证获取全量 commit

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          cache: 'pnpm'

      - name: Install Dependencies and Build
        run: |
          pnpm install
          pnpm run build:dev

      - name: Upload dist via SCP
        if: success()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: '${{ secrets.DEV_SSH_KEY }}'
          port: ${{ secrets.DEV_PORT }}
          source: 'dist'
          target: '/srv/nginx/prn/front-dev'
          overwrite: true
          strip_components: 1

      - name: Notify Feishu (Dev Build)
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ Succeeded"
            TEMPLATE="green"
          else
            STATUS="❌ Failed"
            TEMPLATE="red"
          fi

          # 获取 SHA
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.event.after }}"

          # 获取 commit 列表，最多 10 条
          if [ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ] || [ "$BEFORE_SHA" == "$AFTER_SHA" ]; then
            COMMITS_LIST=$(git log -1 --pretty="format:%h %s (%an)" $AFTER_SHA)
          else
            COMMITS_LIST=$(git log --pretty="format:%h %s (%an)" $BEFORE_SHA..$AFTER_SHA --max-count=10)
          fi

          # 提交数量
          COMMITS_COUNT=$(echo "$COMMITS_LIST" | grep -c '^')

          # 转义 commit 信息
          ESCAPED_COMMITS=$(echo "$COMMITS_LIST" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')

          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          TIME_ISO='${{ github.event.head_commit.timestamp }}'

          FEISHU_WEBHOOK="${{ secrets.FEISHU_WEBHOOK }}"

          # 发送消息
          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "msg_type": "interactive",
            "card": {
              "config": { "wide_screen_mode": true },
              "header": {
                "title": { "tag": "plain_text", "content": "🚀 前端Dev更新" },
                "template": "$TEMPLATE"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**Repository**: $REPO\n**Branch**: $BRANCH\n**Status**: $STATUS\n**Time**: $TIME_ISO\n**Author**: $AUTHOR\n**Commits**: 共 $COMMITS_COUNT 条提交"
                  }
                },
                { "tag": "hr" },
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**提交记录**:\n```\n$ESCAPED_COMMITS\n```"
                  }
                }
              ]
            }
          }
          EOF
