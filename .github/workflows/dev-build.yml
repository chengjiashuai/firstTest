name: Dev Build Notify

on:
  push:
    branches:
      - main
      - master

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Feishu notification (last 10 commits)
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          # 取最多 10 条 commit，拼接成字符串
          ESCAPED_COMMITS=$(echo "$COMMITS_JSON" | jq -r '
            .[:10]
            | map("- " + .message + " (" + .author.name + ")")
            | join("\n")
          ')

          # 兜底，防止 commits 为空
          if [ -z "$ESCAPED_COMMITS" ]; then
            ESCAPED_COMMITS="（本次推送无 commit 信息）"
          fi

          # 发送飞书消息
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {
                \"text\": \"🚀 GitHub Actions 构建通知\n\n📦 仓库：$REPO\n👤 提交人：$ACTOR\n\n📝 最近提交（最多 10 条）：\n$ESCAPED_COMMITS\"
              }
            }"
