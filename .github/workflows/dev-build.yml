name: Dev Build for Frontend

on:
  push:
    branches:
      - dev

jobs:
  notify-feishu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify Feishu
        run: |
          # 获取 SHA
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.event.after }}"

          # 处理首次推送
          if [ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]; then
            COMMITS_LIST=$(git log -1 --pretty="format:%h %s (%an)" $AFTER_SHA)
          else
            # 获取最近推送的最多 10 条 commit
            COMMITS_LIST=$(git log --pretty="format:%h %s (%an)" $BEFORE_SHA..$AFTER_SHA --max-count=10)
          fi

          # 统计提交数量
          COMMITS_COUNT=$(echo "$COMMITS_LIST" | grep -c '^')

          # 转义换行符和双引号，便于 JSON
          ESCAPED_COMMITS=$(echo "$COMMITS_LIST" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')

          # 其他信息
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          TIME_ISO='${{ github.event.head_commit.timestamp }}'

          # 飞书 Webhook
          FEISHU_WEBHOOK="${{ secrets.FEISHU_WEBHOOK }}"

          # 发送消息
          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "msg_type": "interactive",
            "card": {
              "config": { "wide_screen_mode": true },
              "header": {
                "title": { "tag": "plain_text", "content": "🚀 前端Dev更新" },
                "template": "green"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**Repository**: $REPO\n**Branch**: $BRANCH\n**Status**: ✅ Succeeded\n**Time**: $TIME_ISO\n**Author**: $AUTHOR\n**Commits**: 共 $COMMITS_COUNT 条提交"
                  }
                },
                { "tag": "hr" },
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**提交记录**:\n```\n$ESCAPED_COMMITS\n```"
                  }
                }
              ]
            }
          }
          EOF
