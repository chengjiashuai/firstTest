name: Feishu Smoke Test

on: push

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Print webhook exists
        run: |
          if [ -z "${{ secrets.FEISHU_WEBHOOK }}" ]; then
            echo "❌ FEISHU_WEBHOOK is EMPTY"
            exit 1
          else
            echo "✅ FEISHU_WEBHOOK is SET"
          fi

      - name: Send Feishu Message
        run: |
          curl -v -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "🚀 GitHub Actions → 飞书 链路测试成功"
              }
            }'
