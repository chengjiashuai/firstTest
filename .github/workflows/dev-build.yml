name: Dev Build for Frontend

on:
  push:
    branches:
      - dev

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4
        with:
          # ====== 改动1: 切换为本地测试项目 ======
          # repository 和 token 不填，本地仓库默认 checkout
          fetch-depth: 0  # 获取全量 commit

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          cache: 'pnpm'

      - name: Install Dependencies and Build
        run: |
          # ====== 改动2: 避免报错 ======
          pnpm install || echo "skip install"
          pnpm run build:dev || echo "skip build"

      # ====== 改动3: 移除 SCP 上传 ======
      # - name: Upload dist via SCP
      #   ...

      - name: Notify Feishu (Dev Build)
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          set -e

          # 状态
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ Succeeded"
            TEMPLATE="green"
          else
            STATUS="❌ Failed"
            TEMPLATE="red"
          fi

          # 获取 SHA
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.event.after }}"
          BRANCH="${GITHUB_REF##*/}"

          # commit 列表，最多 10 条
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ "$BEFORE_SHA" = "$AFTER_SHA" ]; then
          COMMITS_LIST=$(git log -1 --pretty="format:%s" "$AFTER_SHA")
          else
          COMMITS_LIST=$(git log --pretty="format:%s" "$BEFORE_SHA".."$AFTER_SHA")
          fi

          # commit 数量
          COMMITS_COUNT=$(echo "$COMMITS_LIST" | grep -c '^')

          # 转义 commit 信息
          # ESCAPED_COMMITS="$COMMITS_LIST"
          # 美化提交记录，每条前加 "- "
          ESCAPED_COMMITS=$(echo "$COMMITS_LIST" | sed 's/^/- /')

          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          TIME_ISO='${{ github.event.head_commit.timestamp }}'

          # 发送飞书消息
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "msg_type": "interactive",
            "card": {
              "config": { "wide_screen_mode": true },
              "header": {
                "title": { "tag": "plain_text", "content": "🚀 前端Dev更新" },
                "template": "$TEMPLATE"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**Repository**: $REPO\\n**Branch**: $BRANCH\\n**Status**: $STATUS\\n**Time**: $TIME_ISO\\n**Author**: $AUTHOR\\n**Commits**: 共 $COMMITS_COUNT 条提交"
                  }
                },
                { "tag": "hr" },
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**提交记录**:
          $ESCAPED_COMMITS"
                  }
                }
              ]
            }
          }
          EOF
