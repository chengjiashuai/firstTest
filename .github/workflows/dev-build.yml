name: Dev Build for Frontend

on:
  push:
    branches:
      - dev

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取全量 commit

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          cache: 'pnpm'

      - name: Install Dependencies and Build
        run: |
          pnpm install
          pnpm run build:dev || echo "skip build"

      - name: Notify Feishu (Dev Build)
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          set -e
          
          # ============================
          # 状态
          # 判断上一条命令返回码
          # ============================
          if [ $? -eq 0 ]; then
            STATUS="✅ Succeeded"
            TEMPLATE="green"
          else
            STATUS="❌ Failed"
            TEMPLATE="red"
          fi
          
          # ============================
          # 获取 commit 列表
          # ============================
          git fetch --all
          git checkout dev || true
          
          # 获取最近 10 条 commit
          COMMITS_LIST=$(git log -n 10 --pretty="format:%h %s (%an)" || echo "")
          COMMITS_COUNT=$(echo "$COMMITS_LIST" | grep -c '^')
          ESCAPED_COMMITS=$(echo "$COMMITS_LIST" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          # ============================
          # 其他变量保持原来脚本
          # ============================
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          TIME_ISO='${{ github.event.head_commit.timestamp }}'
          
          # ============================
          # 发送飞书消息
          # ============================
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "msg_type": "interactive",
            "card": {
              "config": { "wide_screen_mode": true },
              "header": {
                "title": { "tag": "plain_text", "content": "🚀 前端Dev更新" },
                "template": "$TEMPLATE"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**Repository**: $REPO\\n**Branch**: $BRANCH\\n**Status**: $STATUS\\n**Time**: $TIME_ISO\\n**Author**: $AUTHOR\\n**Commits**: 共 $COMMITS_COUNT 条提交"
                  }
                },
                { "tag": "hr" },
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**提交记录**:\\n```\n$ESCAPED_COMMITS\n```"
                  }
                }
              ]
            }
          }
          EOF
