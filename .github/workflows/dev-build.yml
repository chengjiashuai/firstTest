name: Dev Build for Frontend

on:
  push:
    branches:
      - dev

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4
        with:
          # ====== 改动1: 切换为本地测试项目 ======
          # repository 和 token 不填，本地仓库默认 checkout
          fetch-depth: 0  # 获取全量 commit

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          cache: 'pnpm'

      - name: Install Dependencies and Build
        run: |
          # ====== 改动2: 避免报错 ======
          pnpm install || echo "skip install"
          pnpm run build:dev || echo "skip build"

      # ====== 改动3: 移除 SCP 上传 ======
      # - name: Upload dist via SCP
      #   ...

      - name: Notify Feishu (Dev Build)
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          set -e

          # 状态
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ Succeeded"
            TEMPLATE="green"
          else
            STATUS="❌ Failed"
            TEMPLATE="red"
          fi

          # 获取 SHA
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.event.after }}"
          BRANCH="${{ github.ref_name }}"
          
          # 获取提交记录逻辑优化
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # 如果是新分支，取最近 5 条记录
            COMMITS_LIST=$(git log --pretty="format:%s" -5 | grep -v '^Merge branch' || true)
          else
            # 正常推送，取 range。如果 git log 失败（如 force push），回退到最近一条
            COMMITS_LIST=$(git log --pretty="format:%s" "$BEFORE_SHA".."$AFTER_SHA" 2>/dev/null | grep -v '^Merge branch' || git log -1 --pretty="format:%s")
          fi
          
          # 如果记录为空（如全是 Merge 提交），确保至少显示最近一条
          if [ -z "$COMMITS_LIST" ]; then
            COMMITS_LIST=$(git log -1 --pretty="format:%s")
          fi

          # 统计提交总数并限制显示数量（防止飞书卡片过大）
          COMMITS_COUNT=$(echo "$COMMITS_LIST" | grep -c '^')
          
          # 转义处理：添加列表符、转义双引号、换行符转义
          ESCAPED_COMMITS=$(echo "$COMMITS_LIST" | head -n 15 | sed 's/^/- /' | sed 's/"/\\"/g' | awk '{printf "%s\\n",$0}')
          
          if [ "$COMMITS_COUNT" -gt 15 ]; then
            ESCAPED_COMMITS="${ESCAPED_COMMITS}... (更多 $COMMITS_COUNT 条提交)"
          fi

          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          TIME_ISO='${{ github.event.head_commit.timestamp }}'

          # 发送飞书消息
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "msg_type": "interactive",
            "card": {
              "config": { "wide_screen_mode": true },
              "header": {
                "title": { "tag": "plain_text", "content": "🚀 前端Dev更新" },
                "template": "$TEMPLATE"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**Repository**: $REPO\\n**Branch**: $BRANCH\\n**Status**: $STATUS\\n**Time**: $TIME_ISO\\n**Author**: $AUTHOR\\n**Commits**: 共 $COMMITS_COUNT 条提交"
                  }
                },
                { "tag": "hr" },
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**Commit Message**:\\n$ESCAPED_COMMITS"
                  }
                }
              ]
            }
          }
          EOF
